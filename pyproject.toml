[project]
name = "pokemon-tcg"
version = "0.1.0"
description = "RL-based solution for pokemon-tcg"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.4",
    "kagglehub>=1.0.2",
    "notebook>=7.6.0",
    "numpy>=2.5.1",
    "omegaconf>=2.3.1",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "seaborn>=0.13.2",
    "tensordict>=0.13.0",
    "torch>=2.13.0",
    "torchrl>=0.13.2",
    "torchvision>=0.28.0",
    "tqdm>=4.68.4",
    "ty>=0.0.60",
    "wandb>=0.28.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.15.21",
]

[tool.pyright]
# cg/ is vendored engine API code and is deliberately not checked or modified.
include = ["src", "tests", "scripts", "main.py"]
typeCheckingMode = "basic"
# tensordict ships no py.typed and types TensorDict.__getitem__ as a broad union
# (Self | Tensor | ... | Any), so pyright flags valid nested-key indexing like
# obs["opp", "discard_mask"] against Tensor's overloads. These three rules are
# disabled to silence that false-positive class; Optional-access and the other
# basic checks stay on.
reportArgumentType = "none"
reportCallIssue = "none"
reportIndexIssue = "none"

[tool.pytest.ini_options]
filterwarnings = [
    # treat warnings as errors
    "error",
    # torchrl defines its own deprecated WeightUpdater subclasses at import
    # time (migration to WeightSyncScheme); we never construct these classes
    # ourselves, so this is upstream noise, not something actionable here.
    "ignore:Creating .*WeightUpdater which inherits from WeightUpdaterBase is deprecated.*:DeprecationWarning",
    # Environmental: on boxes with an old NVIDIA driver, torch's CUDA
    # availability probe (reached incidentally by tensordict.to(cpu)) emits this
    # once. We run CPU-only here; it says nothing about the code under test.
    "ignore:CUDA initialization:UserWarning",
]

[tool.ruff]
target-version = "py312"
# cg/ is vendored engine API code and is deliberately not checked or modified.
extend-exclude = ["cg"]

[tool.ruff.lint]
preview = true
extend-select = [
    "PLR6301", # method could be static / a function
    "ARG",     # unused function/method arguments
    "B",       # bugbear: likely bugs and design problems
    "SIM",     # simplification suggestions
    "SLF",     # flake8-self: access to protected members from outside the class
]
