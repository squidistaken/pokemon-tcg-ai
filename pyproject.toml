[project]
name = "pokemon-tcg"
version = "0.1.0"
description = "RL-based solution for pokemon-tcg"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.4",
    "kagglehub>=1.0.2",
    "notebook>=7.6.0",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
    "tensordict>=0.13.0",
    "torch>=2.13.0",
    "torchrl>=0.13.2",
    "torchvision>=0.28.0",
    "tqdm>=4.68.4",
    "wandb>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
