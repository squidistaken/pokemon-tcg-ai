name: CI

env:
  # Paths that are checked by the `protected-files` job.
  PROTECTED_PATHS: cg ptcg_engine

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  protected-files:
    # Only run CI once a PR is in review to save free-plan compute-minutes.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Keep enough history to diff the PR branch against its base branch.
          fetch-depth: 0

      - name: Check protected paths
        # Fail if a PR changes organizer-provided or protected deck assets.
        run: |
          read -r -a protected_paths <<< "${PROTECTED_PATHS}"

          if git diff --quiet \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- "${protected_paths[@]}"; then
            exit 0
          fi

          echo "Protected paths changed in this PR:" >&2
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- "${protected_paths[@]}" >&2
          echo "Changes to protected paths are blocked by CI: ${protected_paths[*]}" >&2
          exit 1

  checks:
    # Only run CI once a PR is in review to save free-plan compute-minutes.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"

      - name: Check lockfile
        # Fail if pyproject metadata changed without regenerating uv.lock.
        run: uv lock --check

      - name: Sync dependencies
        # Install the project and all dependency groups needed by CI.
        run: uv sync --all-groups

      - name: Lint
        # Run Ruff to catch style issues and common bug patterns.
        run: uv run ruff check .

      - name: Type-check
        # Run Pyright to catch static typing errors.
        run: uv run pyright

      - name: Run tests
        # Run the pytest suite and fail on test failures or unignored warnings.
        run: uv run pytest
