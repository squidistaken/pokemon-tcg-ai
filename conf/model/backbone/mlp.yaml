# The proven PPO baseline trunk: a flat MLP over the observation vector.
# input_dim and out_features are injected by build_actor_critic from the specs.
_target_: src.models.backbone.MLPBackbone
num_cells: [256, 256]
activation: tanh
# Observation keys to consume. The env nests the encoder output under
# "observation"; the flat encoder's single field is also "observation", so the
# flat vector lives at the nested key ("observation", "observation").
in_keys: [[observation, observation]]
