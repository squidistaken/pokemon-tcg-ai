# Self-attention trunk: one token per observation group (see
# src/models/transformer.py), attending across groups instead of flattening
# them into one vector like model/backbone/mlp.yaml. input_dim, out_features
# and the StructuredObsAdapter (widths in model.adapter) are injected by
# build_actor_critic from the specs, same as the MLP backbone.
_target_: src.models.transformer.TransformerBackbone
# Deliberately shallow: the MLP is still the proven baseline and the
# per-observation feature sequence is short (~10 groups), so this is not a
# deep stack.
num_heads: 4
num_layers: 1
ff_dim: 256
dropout: 0.0
activation: gelu
# Everything below preserves the as-shipped behaviour of the first Issue-45
# run, so this file stays the reference arm. conf/experiment/tf_*.yaml turn
# them on one at a time; see src/models/transformer.py for what each does.
#
# norm_first=false is torch's default post-LN, the variant that conventionally
# needs an LR warmup the PPO config does not have. true switches to pre-LN.
norm_first: false
# LayerNorm on the encoder output; conventional alongside pre-LN.
final_norm: false
# Readout over the token sequence: mean | cls | attention. mean averages
# semantically incomparable group summaries together.
pooling: mean
# Groups to expand into per-entity tokens instead of one pooled summary, e.g.
# [pokemon] (+18 tokens). Empty means the trunk attends over the adapter's
# masked-mean group vectors only -- the same features the MLP consumes. Costs
# adapter.group_slot_counts[name] tokens each, and attention is quadratic.
token_groups: []
# Emit per-option tokens as option_repr for model/head=pointer. Linear in the
# option count, unlike routing options through self-attention.
option_tokens: false
# Observation keys to consume, nested under the env's "observation" key.
# These are StructuredObservationEncoder's top-level groups (see its .spec()),
# each handled by the adapter and kept as its own token (not flattened).
in_keys:
  - [observation, globals]
  - [observation, select_cats]
  - [observation, context_card_ids]
  - [observation, stadium_id]
  - [observation, options]
  - [observation, pokemon]
  - [observation, my]
  - [observation, opp]
  - [observation, select_deck]
  - [observation, looking]
