# Hydra docs: https://hydra.cc/docs/intro/
# Random baseline (default):  python -m src.train
# PPO/MLP baseline:           python -m src.train agent=ppo
defaults:
  - paths: default
  - agent: dummy
  - env: default
  - collector: default
  - model: default
  - train: ppo_selfplay
  - _self_

seed: 42
set_seed: false

# Keep Hydra's own logs and multirun artifacts under the configured output
# location as well. The default expands to Hydra's usual outputs/date/time
# layout; Slurm profiles can redirect the root to scratch storage.
hydra:
  run:
    dir: ${paths.output_dir}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${paths.output_dir}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
