# Hydra docs: https://hydra.cc/docs/intro/
# Random baseline (default):  python -m src.train
# PPO/MLP baseline:           python -m src.train agent=ppo
# PPO/MLP self-play:          python -m src.train agent=ppo train=ppo_selfplay
# No W&B run:                 python -m src.train callbacks=none
# Label a run:                python -m src.train agent=ppo wandb.group=ablation-lr
defaults:
  - agent: dummy
  - env: default
  - collector: default
  - model: default
  - train: baseline
  - callbacks: wandb
  - _self_

seed: 42
set_seed: false

# W&B run settings, read by conf/callbacks/wandb.yaml. Kept at the top level so
# a run is labelled with `wandb.group=...` regardless of which callbacks group
# is selected; under `callbacks=none` these are simply unused.
wandb:
  project: pokemon-tcg-ai
  # null sends each teammate's runs to their own default entity.
  entity: pokemon-tcg-ai
  # e.g. ppo-mlp-linear-s42; null gives W&B's random names instead.
  name: ${hydra:runtime.choices.agent}-${hydra:runtime.choices.model/backbone}-${hydra:runtime.choices.model/head}-s${seed}
  # Keeps related runs (a sweep, a seed set) together in the UI.
  group: null
  job_type: train
  tags: []
  # online, offline (record for a later `wandb sync`), disabled or shared.
  mode: online
  notes: null
