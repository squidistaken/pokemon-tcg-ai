# Archetype-filtered slice of the tournament deck corpus under decks/,
# restricted to archetypes with at least 8 lists: 19 archetypes, 316 of the
# corpus's 400 decks.
#
# Why the filter: the curriculum's level space is archetype *pairs*, so it grows
# with the square of the archetype count while the episode budget stays fixed.
# All 61 archetypes give 3721 matchups, or ~4 episodes each at 2M frames -- too
# few for a level's mean-residual score to mean anything, and under the
# curriculum's min_visits floor. The threshold trades the long tail of
# rarely-played archetypes (keeping 316 of 400 decks) for 361 matchups at ~42
# episodes each, where scores are averages over enough games to rank on. It also
# keeps the 20% holdout meaningful -- the split is global rather than stratified,
# so with only a handful of lists per archetype the thinner ones would often
# contribute nothing at all to the evaluator. At >=8 the split lands 253 decks in
# train and 63 across 18 of the 19 archetypes in eval.
#
# Re-pinned 2026-08-01 after a corpus refresh (329 -> 400 decks) pushed
# dragapult-blaziken, mega-venusaur, raging-bolt-ogerpon and slowking past the
# threshold. Runs before and after that re-pin are different experiments: the
# previous pool was the 15 archetypes this list held minus those four.
#
# Entries are ${paths.data_dir}-relative, not hardcoded "decks/<archetype>":
# the corpus has since been reorganized into per-resolution-strategy
# subdirectories (decks/heuristic-resolved/, decks/mapping-resolved/), so a
# bare "decks/<archetype>" no longer resolves (every archetype directory
# moved one level deeper). A run now needs paths.data_dir set to whichever
# subdirectory it wants -- e.g. paths.data_dir=decks/heuristic-resolved -- or
# resolve_deck_paths raises "matched no CSV files" at env-factory time, not at
# Hydra compose time, which is why this crashed mid-job rather than at
# submission (see scripts/run_ptr_sweep.sh's --decks-dir).
#
# Usage:
#   python -m src.train agent=ppo env=multideck_v2 train=ppo_selfplay \
#     paths.data_dir=decks/heuristic-resolved
defaults:
  - default
  - _self_

deck_matchup: independent
eval_deck_matchup: mirror
deck_sampling: uniform
deck_holdout_frac: 0.2

deck_pool:
  - ${paths.data_dir}/alakazam-dudunsparce
  - ${paths.data_dir}/cynthias-garchomp
  - ${paths.data_dir}/dragapult
  - ${paths.data_dir}/dragapult-blaziken
  - ${paths.data_dir}/dragapult-dusknoir
  - ${paths.data_dir}/festival-lead
  - ${paths.data_dir}/flareon-noctowl
  - ${paths.data_dir}/grimmsnarl-froslass
  - ${paths.data_dir}/lucario-hariyama
  - ${paths.data_dir}/mega-lucario
  - ${paths.data_dir}/mega-venusaur
  - ${paths.data_dir}/ns-zoroark
  - ${paths.data_dir}/ogerpon-meganium
  - ${paths.data_dir}/other
  - ${paths.data_dir}/raging-bolt-ogerpon
  - ${paths.data_dir}/rockets-honchkrow
  - ${paths.data_dir}/rockets-mewtwo
  - ${paths.data_dir}/rockets-porygon-z
  - ${paths.data_dir}/slowking
