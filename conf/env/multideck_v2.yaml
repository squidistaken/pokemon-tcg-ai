# Merged deck corpus (decks/ + decks_v2/), restricted to archetypes with at
# least 15 lists: 37 archetypes, 1759 decks.
#
# Why both roots: the two corpora are different tournament snapshots that share
# archetype names but almost no individual lists (14 of 2071 decks overlap by
# content hash). Pointing the pool at both is lossless -- ArchetypeIndex groups
# by folder *name*, so same-named folders across roots merge into one
# archetype. Extracting one over the other would instead silently replace 143
# same-named files that hold different decks.
#
# Why the >=15 filter: the curriculum's level space is archetype *pairs*, so it
# grows with the square of the archetype count while the episode budget stays
# fixed. All 104 archetypes give 10,816 matchups, or ~1.4 episodes each at 2M
# frames -- far too few for a level's mean-residual score to mean anything. The
# threshold trades the long tail of rarely-played archetypes (keeping 1759 of
# 2071 decks) for 1369 matchups at ~11 episodes each, where scores are averages
# over enough games to rank on.
#
# Usage:
#   python -m src.train agent=ppo env=multideck_v2 train=ppo_selfplay
defaults:
  - default
  - _self_

deck_matchup: independent
eval_deck_matchup: mirror
deck_sampling: uniform
deck_holdout_frac: 0.2

deck_pool:
  - decks/alakazam-dudunsparce
  - decks_v2/alakazam-dudunsparce
  - decks/basic-box
  - decks_v2/basic-box
