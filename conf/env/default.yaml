# Deck CSVs are defined in the scheduler-independent paths config so storage
# can be redirected without changing env settings.
deck0: ${paths.deck0}
deck1: ${paths.deck1}
# Padded size of the option space (stop action excluded); must exceed the
# largest option list the engine can offer, or options get truncated.
max_options: 96
# Observation encoder: "structured" (default, card-aware tokens; MLPBackbone
# flattens it) or "flat" (legacy 36-dim vector, kept only for regression
# testing/reference comparison — not a supported training path).
encoder: structured
# Number of environment instances to run, each with its own battle handle.
num_workers: 16
# Collect with a multiprocess ParallelEnv (true) or a single-process SerialEnv (false).
parallel: true
# Multiprocessing start method for ParallelEnv workers (e.g. fork, spawn).
mp_start_method: fork
# When parallel is true but num_workers is 1, fall back to a single-process env
# instead of paying multiprocessing overhead for one worker.
serial_for_single: true
