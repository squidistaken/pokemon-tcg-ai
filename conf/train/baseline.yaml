# Fixed-opponent training: the agent faces the built-in RandomOpponent for the
# whole run. This is the honest control that self-play runs are compared against.
# Snapshotting disabled -> no self-play league is built and the environments
# take their default random opponent.
snapshot_interval: 0
# Unused while snapshot_interval is 0; kept so `train=baseline` and
# `train=ppo_selfplay` expose the same keys.
warmup_opponent: random
checkpoint_dir: checkpoints
pool_size: 5

# Periodic evaluation against a fixed RandomOpponent, logged to W&B under
# "eval/". Off by default here: training already runs against that same
# opponent, so the collected win_rate is the identical signal for free.
eval_interval: 0
eval_episodes: 100
# Take the policy's argmax (true) or sample from it (false). Deterministic
# gives a lower-variance curve; stochastic matches collection-time behaviour.
eval_deterministic: true
# Fixed opponent the evaluator scores against, if eval_interval enables it.
# Kept here so `train=baseline` and `train=ppo_selfplay` expose the same keys.
eval_opponent: random
