# Self-play training: the learner is periodically frozen into an opponent pool
# the environments sample from. Everything not listed below comes from
# default.yaml.
defaults:
  - default
  - _self_

snapshot_interval: 50000
# Periodic evaluation is essential here: under self-play the collected win_rate
# is pinned near 0.5 by construction, so it says nothing about whether the agent
# improved. The evaluator faces the fixed `eval_opponent` instead.
eval_interval: 50000  # every X timesteps
# Fewer episodes than the default: this runs repeatedly during a run, and each
# evaluation episode is time not spent collecting.
eval_episodes: 15
# On by default here: cross-play needs snapshot_interval > 0.
cross_play: true
