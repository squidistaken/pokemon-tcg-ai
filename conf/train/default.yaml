# Keys shared by every training variant in this group. The variants
# (fixed_opponent.yaml, ppo_selfplay.yaml) include this file and override only
# what actually differs between them, so a key lives in exactly one place.
# Defaults here are the "off" settings: no self-play league, no periodic eval.

# Opponent faced before the first learner snapshot exists, and a permanent
# league member afterwards, so the agent keeps a fixed reference point instead
# of drifting against copies of itself. "random" is the only implemented value.
warmup_opponent: random
# Freeze the learner into the self-play pool every N collected frames
# (0 disables periodic self-play snapshots -> train against the warmup
# opponent only). Every PPO run still writes one final submission checkpoint.
snapshot_interval: 0
# Directory learner snapshots are written to and reloaded from (ParallelEnv
# workers reload from disk; no shared Python object across processes).
# Relative paths resolve inside the Hydra run directory, so each run gets a
# fresh league and cannot inherit a previous run's snapshots.
checkpoint_dir: checkpoints
# Number of most-recent snapshots kept in the opponent pool.
pool_size: 5

# Periodic evaluation against a fixed opponent, logged to W&B under "eval/"
# every N collected frames (0 disables it).
eval_interval: 0
eval_episodes: 100
# Take the policy's argmax (true) or sample from it (false). Deterministic
# gives a lower-variance curve; stochastic matches collection-time behaviour.
eval_deterministic: true
# Fixed opponent the evaluator scores against, set explicitly rather than
# inherited from the environment's default. It must not move with the learner,
# or the eval curve stops being comparable across the run. "random" is the only
# implemented value. Note that it saturates: once the policy reliably beats
# random the curve flattens.
eval_opponent: random
