# Keys shared by every training variant in this group. The variants
# (fixed_opponent.yaml, ppo_selfplay.yaml) include this file and override only
# what actually differs between them, so a key lives in exactly one place.
# Defaults here are the "off" settings: no self-play league, no periodic eval.

# Opponent faced before the first learner snapshot exists, and a permanent
# league member afterwards, so the agent keeps a fixed reference point instead
# of drifting against copies of itself. "random" is the only implemented value.
warmup_opponent: random
# Freeze the learner into the self-play pool every N collected frames
# (0 disables snapshotting -> train against the warmup opponent only).
snapshot_interval: 0
# Directory learner snapshots are written to and reloaded from (ParallelEnv
# workers reload from disk; no shared Python object across processes).
# Relative paths resolve inside the Hydra run directory, so each run gets a
# fresh league and cannot inherit a previous run's snapshots.
checkpoint_dir: checkpoints
# Number of most-recent snapshots kept in the opponent pool.
pool_size: 5

# How the league draws the opponent for each episode:
#   uniform -> every member equally likely (plain fictitious self-play).
#   pfsp    -> weight members by the learner's win rate against them, so the
#              budget concentrates on members that still contest the game
#              instead of on ones already beaten. Win rates are tracked per
#              worker from terminal rewards; no extra inter-process traffic.
opponent_sampling: uniform
# PFSP weighting scheme (ignored under uniform sampling):
#   hard -> (1 - p)^pfsp_exponent, favours members that beat the learner.
#   even -> p * (1 - p), favours members the learner is level with.
pfsp_weighting: hard
# Exponent of the `hard` scheme; larger concentrates harder. Unused by `even`.
pfsp_exponent: 2.0
# Floor added to every member's weight so none becomes unreachable: a member
# the learner always beats still needs occasional games, or its win rate stops
# tracking the current policy.
pfsp_min_weight: 0.05
# Strength of the p = 0.5 prior, in games. Keeps the first episodes against a
# fresh snapshot from pinning its weight to an extreme.
pfsp_prior_games: 2.0

# Periodic evaluation against a fixed opponent, logged to W&B under "eval/"
# every N collected frames (0 disables it).
eval_interval: 0
eval_episodes: 100
# Take the policy's argmax (true) or sample from it (false). Deterministic
# gives a lower-variance curve; stochastic matches collection-time behaviour.
eval_deterministic: true
# Fixed opponent the evaluator scores against, set explicitly rather than
# inherited from the environment's default. It must not move with the learner,
# or the eval curve stops being comparable across the run.
#
#   "random"          -> RandomOpponent (fast, but saturates early).
#   "first_snapshot"  -> oldest snapshot from checkpoint_dir as a greedy
#                        opponent; falls back to random when none exist yet.
#   "/path/to/ckpt.pt"-> a specific save_actor_critic checkpoint (e.g. a
#                        previous run's best-submitted agent).
eval_opponent: random
# Score against several references at once (overrides eval_opponent when set).
# Each entry is an eval_opponent value; metrics are namespaced per opponent
# ("random/win_rate", "first_snapshot/win_rate"). Evaluation cost is the sum
# over entries, so each costs a full eval_episodes run.
eval_opponents: null
