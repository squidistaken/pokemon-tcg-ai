# Scheduler-independent input/output locations. Override these from the CLI or
# from a Slurm profile when data and results should live on scratch storage.
data_dir: decks
output_dir: outputs
# Append-only index of completed PPO checkpoints. Slurm sets the environment
# variable to the same repository-local path explicitly.
checkpoint_registry: ${oc.env:CHECKPOINT_KEYS_FILE,logs/checkpoint_keys.csv}

# Input decks consumed by the environment.
deck0: ${paths.data_dir}/example.csv
deck1: ${paths.data_dir}/example.csv
