name: ppo
# PPO surrogate clipping range.
clip_epsilon: 0.2
# Entropy-bonus weight.
entropy_coeff: 0.01
# Discount factor for GAE.
gamma: 0.99
# GAE trace-decay factor.
lmbda: 0.95
# Adam learning rate.
lr: 3.0e-4
# Optimization epochs over each collected batch.
num_epochs: 4
# Minibatch size drawn from the replay buffer per optimizer step.
sub_batch_size: 256
# Frames collected per collector iteration (overrides collector.frames_per_batch).
frames_per_batch: 4096
# Gradient-norm clipping threshold.
max_grad_norm: 1.0
