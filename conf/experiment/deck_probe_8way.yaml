# @package _global_
# One deck-pinned arm per candidate deck, all warm-started from the same
# checkpoint and run together on a single GPU.
#
#   sbatch slurm-conf/train_deck_probe_8way.sh
#
# or one arm on its own, for a short probe:
#
#   uv run python -m src.train --config-name ppo_selfplay_multideck \
#     +experiment=deck_probe_8way collector.total_frames=100000 \
#     train.warmup_checkpoint=<snapshot> \
#     env.eval_agent_deck=decks/heuristic-resolved/slowking/slowking.csv
#
# This inherits conf/experiment/deck_pinned_selfplay_local.yaml rather than
# restating it, so the mirror self-play league is the one that arm already
# validates: PFSP with `hard` weighting, pool_size 24, snapshot_interval 1M,
# pfsp_min_weight 0.15, agent_deck_mirror true and agent_deck_field_prob 0.0.
#
# deck_corpus stays top20, and in these arms it feeds evaluation only. Training
# never samples it: agent_deck_field_prob is 0.0, so _sample_mirror
# (src/env/decks/agent_deck_sampler.py:171) always deals the pinned deck to both
# seats and leaves the field sampler untouched. The corpus therefore decides one
# thing, the 10-list round-robin eval panel, which is identical across arms. The
# pinned deck is
# loaded from its own path and does not have to belong to that corpus
# (src/training/env_factory.py:521), which is what lets an arm pilot a list from
# the full corpus while the field stays fixed across arms. env.agent_deck
# interpolates ${env.eval_agent_deck}, so one override per arm pins both the
# training seat and the eval seat, and the arms differ in nothing else.
defaults:
  - deck_pinned_selfplay_local
  - _self_

train:
  # train.warmup_checkpoint is NOT set here and must be passed on the command
  # line. It is the checkpoint every arm starts from, frozen into each arm's
  # league as the permanent anchor and used below as the eval yardstick, and it
  # is whatever the weighted-field arm reached before it was stopped, so it
  # cannot be a committed constant.
  #
  # Omitted rather than marked `???`: OmegaConf reads a missing value in a
  # merged config as "no value supplied" and keeps the one it inherits, so the
  # marker would not fail at startup. It would silently leave all eight arms
  # anchored to weighted_field.yaml's 150M snapshot. Both launchers require the
  # value instead (scripts/train_deck_probe_arm.sh checks CHECKPOINT), and a
  # direct `python -m src.train` run has to pass it by hand.
  # The same three references for every arm, which is what makes the arms
  # comparable. The anchor answers "did this deck improve on the policy it
  # started from", random is the absolute yardstick, and the 10.14M MLP is the
  # only opponent shared with the existing runs, so it ties this experiment back
  # to them. Interpolated from warmup_checkpoint so the anchor and the yardstick
  # cannot drift apart.
  eval_opponents:
    - ${train.warmup_checkpoint}
    - random
    - outputs/deck-pinned-20260808/mlp-ptr-pinned-15m-s42/checkpoints/snapshot_000010141696.pt

env:
  # 64 allocated cores split across 8 arms. collector.frames_per_batch is 16384
  # and divides by 8, so every collection ends on a whole batch.
  num_workers: 8

collector:
  # Deliberately past what a day collects (~19M frames per arm at ~225 fps), so
  # the wallclock stops the arms rather than the budget. An arm that hit its
  # target early would return its cores to the others and speed up whatever was
  # still running, which would leave the comparison confounded by finishing
  # order. The launcher turns this into an absolute target by adding the warm
  # start's frame count.
  total_frames: 100000000

wandb:
  tags:
    - pointer-head
    - transformer
    - pokemon-tokens
    - observation-weighted
    - deck-pinned
    - deck-probe-8way
  notes: >-
    One deck-pinned mirror self-play arm per candidate deck, all warm-started
    from the same weighted-field snapshot and sharing one GPU. League, opposing
    field and eval panel are identical across arms; only the pinned deck differs.
