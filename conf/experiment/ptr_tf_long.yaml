# @package _global_
# pointer-transfer-45, follow-up tier — how far does the pointer head actually go?
#
# transformer-diagnosis-45 P1 §9.6. `tf_pointer` reached eval/random >=0.85 at
# 0.51M frames (reference: 1.02M), held it for 10 of 15 rounds, showed the
# sweep's healthiest dynamics (grad_norm flat 0.18-0.27, entropy stable at
# 0.53-0.58 nats, critic loss 0.021), showed no late regression where 4 of 4
# flat-head runs did — and was still climbing at 4M (0.675 -> 0.950 on the last
# four rounds). Nothing in the data says where it stops.
#
# Deliberately not part of the 4M sweep: this is the arm you run *after* arms 1-4
# say which backbone deserves the frames. If arm 2 (MLP + pointer) reproduces the
# effect, ptr_mlp_long.yaml is the matched counterpart at the same 12M frame
# budget — see that file for why frames rather than wall clock are held equal.
#
# Budget: 12M rather than the analysis's 15-20M, set by the wall clock rather
# than by the science. 12M / 376 fps = 8.9h against the train_gpu profile's
# 12:00:00, leaving ~3h for the 48 eval rounds and startup. 15M would be 11.1h,
# i.e. no margin at all, and the previous sweep already lost a run at 97.5%
# completion. Raise `time` in slurm-conf/train_gpu.yaml (or add a resume path)
# before asking for more.
#
# Everything else — eval_interval 250k, snapshot_interval 200k, eval_episodes 40
# — is left identical to the 4M arms so the first 16 eval rounds are directly
# comparable to them, and the league grows on the same schedule. The tradeoff is
# that pool_size 5 at 200k spans only the most recent 1M frames, or 8% of this
# budget against 25% at 4M: a later-run league of nearer copies. Change it only
# if that shows up as a plateau against first_snapshot while eval/random keeps
# climbing.
defaults:
  - override /model/head: pointer

model:
  backbone:
    option_tokens: true

collector:
  total_frames: 12000000

wandb:
  name: ptr-tf-long-s${seed}
  tags:
    - issue-45
    - ptr-sweep
    - pointer-head
    - long-run
  notes: >-
    Pointer-transfer sweep follow-up: the pointer head at 12M frames, three
    seeds. Everything except total_frames matched to the 4M arms.
