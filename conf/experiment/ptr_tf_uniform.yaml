# @package _global_
# pointer-transfer-45, arm 8/8 — is the curriculum doing anything?
#
# transformer-diagnosis-45 §7 found the PLR curriculum is, past ~1M frames,
# approximately uniform sampling over 361 fixed matchups: score_std/score_mean
# ~= 0.58 with score_max only 0.034-0.071 under score_temperature: 0.9, having
# collapsed ~5x from its 0.25M values (score_std 0.0569, score_max 0.4395). The
# replacement mechanism is dead code as well — env.curriculum.capacity: 4000
# against 361 levels means the buffer can never evict. All 15 runs were
# identical on every structural curriculum metric, with zero evictions and
# between-arm spread smaller than the same-config duplicate spread.
#
# So the label "PLR deck curriculum" is doing more work than the sampler is, and
# nothing in the sweep tests the counterfactual. This arm turns the curriculum
# off, leaving the inherited multideck_v2 uniform sampling over the same pinned
# 19-archetype pool with the same 20% holdout — one change, same corpus, same
# eval distribution:
#   matches   -> the machinery (PLR buffer, anchor games, min_visits floor,
#                staleness term, ~12% of the run spent clearing the visit floor)
#                is complexity without a measured return at this level count,
#                and future sweeps get a simpler, stationary task distribution
#                to test model claims against.
#   loses     -> PLR earns its keep, and §7's "approximately uniform" reading is
#                about the late-run score spread, not about what the early
#                prioritisation bought.
#
# Free to run: no code change, no throughput cost, and it is the only arm whose
# result is useful whichever way the model comparisons land.
defaults:
  - override /model/head: pointer

model:
  backbone:
    option_tokens: true

env:
  curriculum:
    # Falls back to multideck_v2's deck_sampling: uniform over the same pool.
    enabled: false

wandb:
  name: ptr-tf-uniform-s${seed}
  tags:
    - issue-45
    - ptr-sweep
    - pointer-head
    - no-curriculum
  notes: >-
    Pointer-transfer sweep: PLR curriculum disabled, uniform matchup sampling
    over the same pinned 19-archetype pool. Tests whether the curriculum beats
    the uniform sampling it was measured to approximate past ~1M frames.
