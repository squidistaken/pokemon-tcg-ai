# @package _global_
# pointer-transfer-45, arm 4/8 — the one real effect, measured properly.
#
# Same config as conf/experiment/tf_pointer.yaml, re-run at three seeds. That
# arm's evidence (transformer-diagnosis-45 §2) is strong for n=1 — the three
# pointer-containing runs took the top 3 of 12 on six independent channels with
# zero overlap, p = 0.0045 per channel — but it is still n=1 per config, and the
# margin on eval/random alone (+0.069) sits inside the noise floor. Three seeds
# is what turns "the ordering cannot be chance" into an effect size.
#
# It also serves as the base config for arms 5-8, which are single changes on
# top of it rather than on top of the flat-head reference: the pointer head is
# the sweep's new baseline, and stacking on the losing configuration is how the
# last sweep ended up with eight unattributable arms.
#
# Cell (transformer, pointer) of the 2x2 backbone x head factorial.
defaults:
  - override /model/head: pointer

model:
  backbone:
    # Emits option_repr; the head raises at build time without it.
    option_tokens: true

wandb:
  name: ptr-tf-pointer-s${seed}
  tags:
    - issue-45
    - ptr-sweep
    - pointer-head
    - transformer-backbone
  notes: >-
    Pointer-transfer sweep: PointerPolicyHead over per-option tokens on the
    transformer trunk — a replication of transformer-diagnosis-45's only
    outside-noise arm at three seeds, and the base config for arms 5-8.
