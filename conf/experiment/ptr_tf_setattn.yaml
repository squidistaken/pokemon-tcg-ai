# @package _global_
# pointer-transfer-45, arm 7/8 — the first actual test of the attention premise.
#
# This is the arm the whole sweep exists to make measurable, and the one item on
# transformer-diagnosis-45's "still untested" list that no configuration in the
# repo can currently express: option-token *self-attention* rather than the
# linear projection the pointer arm uses — the Set Transformer trunk of
# docs/architecture/ppo-transformer-actor-critic.md Phase 2.
#
# Why it is the crux. The pointer head won by giving the policy a per-option
# representation, but that representation is one nn.Linear (plus a segment
# embedding) over the adapter's option rows (src/models/transformer.py#L492-494,
# the encoded_option_repr=False default); it never enters the encoder. So
# every positive result in this project so far is attributable to option
# *identity*, and none to attention. Here each option token is contextualised
# against the board and against the other legal options before it is scored,
# which is the only version of "attention helps" that the pointer result has not
# already explained away. If this does not beat arm 4, attention has been given
# its fair test on the one representation that demonstrably matters, and the
# answer is no.
#
# Cost is the reason this arm is last and the most expensive: 129 option tokens
# take the sequence to ~138, and the encoder runs on CPU inside all 32 workers
# (46% of throughput per docs/training-performance.md) as well as on the GPU.
# Budget ~5 A100-h a seed against the pointer arm's 2.96, and treat that figure
# as an estimate — per-arm fps in the last sweep was confounded up to 1.56x by
# node co-tenancy (§4). Measured since on an unbatched CPU forward (1 thread):
# 139 tokens (this arm's shape) is 2.88 ms against the reference's 1.90 ms —
# +50%, not the multiplicative blowup the quadratic-attention framing implied;
# see conf/model/backbone/transformer.yaml for the full cost table.
#
# Needed two small code changes, both landed:
#   - `replace_pooled` (see conf/experiment/ptr_tf_entities.yaml), so the pooled
#     `options` summary is not carried alongside the 129 entity tokens.
#   - `encoded_option_repr`: take option_repr from the encoder *output* rows for
#     the option tokens instead of from entity_projections. Before this
#     existed, `token_groups: [options]` already routed option rows through
#     the encoder, but the pointer head still read the unencoded projection —
#     paying the 129² attention cost and discarding the result — so the arm
#     would have silently measured "does attention over options improve the
#     pooled state" instead of the question above. TransformerBackbone now
#     rejects that combination (`options` in token_groups + option_tokens +
#     not encoded_option_repr) at construction rather than letting it run
#     silently wrong.
defaults:
  - override /model/head: pointer_dot

model:
  backbone:
    option_tokens: true
    num_layers: 2
    ff_dim: 512
    # 129 option rows (max_options + the synthetic stop) as tokens, replacing
    # the pooled `options` summary: ~138 tokens total.
    token_groups: [options]
    replace_pooled: true
    # Score encoded option tokens, not their linear projections.
    encoded_option_repr: true

wandb:
  name: ptr-tf-setattn-s${seed}
  tags:
    - issue-45
    - ptr-sweep
    - pointer-head
    - option-attention
  notes: >-
    Pointer-transfer sweep: option tokens through the encoder and scored from
    their encoded rows (Set Transformer / arch doc Phase 2). The one test that
    can credit attention rather than option identity for the pointer gain.
